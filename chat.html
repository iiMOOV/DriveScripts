<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIVE CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --or1:#FBA018; --or2:#F26A05; --acc:#F7820E; --acc-soft:rgba(247,130,14,.16);
  --bg:#141317; --bg2:#0F0E12; --side:#111015; --chat:#17161B;
  --bub-o:#201F26; --bub-m:#241a0f; --line:rgba(255,255,255,.06);
  --tx:#F3F1F0; --mut:#8C8A93; --dk:#160C02;
  --on:#3FB950; --busy:#F7820E; --off:#5B6069;
  --admin:#E5484D; --mod:#4F9CF9; --vip:#F5C518; --rank:#F7820E;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',system-ui,'Segoe UI',sans-serif}
html,body{height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(247,130,14,.45);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.win{width:100%;height:100%;max-width:1180px;max-height:940px;display:flex;flex-direction:column;
  background:var(--bg);border:1px solid rgba(247,130,14,.35);border-radius:18px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.55);position:relative}

/* ===== HEADER ===== */
.hdr{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:linear-gradient(180deg,var(--or1),var(--or2));position:relative}
.hdr::after{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.10)}
.hdr>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{font-weight:900;font-style:italic;font-size:26px;color:var(--dk);letter-spacing:.5px}
.brand .ttl{font-weight:700;font-size:18px;color:#1a0f04}
.brand .ic{font-size:20px}
.hctrl{display:flex;align-items:center;gap:10px}
.opac{display:flex;align-items:center;gap:8px;color:#2a1704;font-weight:500;font-size:13px}
.opac input{accent-color:#1a0f04;width:86px}
.hbtn{width:36px;height:36px;border:none;border-radius:9px;background:rgba(20,10,2,.55);color:#fff;
  font-size:16px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.hbtn:hover{background:rgba(20,10,2,.8)}
.hbtn.xbtn:hover{background:#B4231C}
.hbtn.off{opacity:.5}

/* ===== HINT ===== */
.hint{margin:10px auto 4px;padding:7px 20px;background:rgba(8,8,10,.9);border-radius:16px;color:var(--mut);
  font-size:13px;text-align:center;width:fit-content}

/* ===== BODY ===== */
.body{flex:1;display:flex;min-height:0;padding:6px 14px 0}

/* sidebar */
.side{width:250px;flex:0 0 250px;background:var(--side);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;margin-left:14px;overflow:hidden}
.side .sh{padding:12px 14px 6px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px}
.side .sh .n{color:var(--mut);font-weight:500;font-size:14px}
.srch{margin:4px 12px 8px;display:flex;align-items:center;gap:8px;background:#191820;border-radius:9px;padding:0 12px}
.srch input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:13px;padding:9px 0}
.srch input::placeholder{color:var(--mut)}
.srch .mag{color:var(--mut);font-size:13px}
.mlist{flex:1;overflow-y:auto;padding:2px 8px}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:.12s}
.mrow:hover{background:rgba(247,130,14,.10)}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:#fff;position:relative;overflow:hidden;background-size:cover;background-position:center}
.av .dot{position:absolute;bottom:-1px;left:-1px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--side)}
.dot.on{background:var(--on)} .dot.busy{background:var(--busy)} .dot.off{background:var(--off)}
.mrow .mi{flex:1;min-width:0}
.mrow .mn{font-weight:700;font-size:14px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.mrow .ms{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;letter-spacing:.3px;flex:0 0 auto}
.b-admin{background:var(--admin)} .b-mod{background:var(--mod)} .b-vip{background:var(--vip);color:#1a1200}
.b-rank{background:var(--rank);color:#1a0f04}
.dlink{font-size:11px;flex:0 0 auto}

/* chat */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;background:var(--chat);border:1px solid var(--line);border-radius:12px;padding:14px 12px}
.msg{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.mine{flex-direction:row-reverse}
.msg.sys{justify-content:center}
.msg .mav{flex:0 0 40px}
.mbody{max-width:66%;min-width:0}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg.mine .mhead{flex-direction:row-reverse}
.mname{font-weight:700;font-size:14px;color:var(--acc);cursor:pointer}
.mname:hover{text-decoration:underline}
.mtime{font-size:11px;color:var(--mut)}
.bub{background:var(--bub-o);border-radius:12px;padding:9px 13px;color:var(--tx);font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.mine .bub{background:var(--bub-m);border-right:3px solid var(--acc)}
.msg.sys .bub{background:#100F14;color:#f0c8a0;text-align:center;border:1px solid rgba(247,130,14,.25)}
.bub img.stick{max-width:150px;max-height:150px;border-radius:10px;display:block}

/* input row */
.foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.picks{display:flex;gap:8px}
.pbtn{min-width:42px;height:42px;border:none;border-radius:11px;background:#1a1922;color:#fff;font-size:18px;cursor:pointer;transition:.12s;padding:0 8px}
.pbtn:hover{background:rgba(255,255,255,.10)} .pbtn.on{background:var(--acc);color:var(--dk)}
.inwrap{flex:1;display:flex;align-items:center;background:#1a1922;border:1px solid rgba(247,130,14,.25);border-radius:12px;padding:0 6px 0 14px}
.inwrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;padding:13px 0}
.inwrap input::placeholder{color:var(--mut)}
.send{width:46px;height:38px;border:none;border-radius:10px;background:var(--acc);color:var(--dk);font-size:18px;cursor:pointer;transition:.12s}
.send:hover{background:#ff9a2a}

/* picker panel */
.panel{margin:0 14px;background:var(--bg2);border:1px solid rgba(247,130,14,.4);border-radius:12px;
  padding:10px;max-height:250px;overflow-y:auto;display:none}
.panel.show{display:block}
.egrid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.egrid span{font-size:20px;text-align:center;cursor:pointer;border-radius:6px;padding:4px 0}
.egrid span:hover{background:var(--acc-soft)}
/* الستيكرز مربعات صغيرة ثابتة، والـ GIF أعرض شوي — والقائمة تتمرر لأي عدد (40+ عادي) */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sgrid.g3{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.sgrid img{max-height:110px}
.sgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:#1a1922}
.sgrid img:hover{outline:2px solid var(--acc)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pgrid button{border:none;border-radius:9px;background:#1a1922;color:#fff;font-size:14px;padding:11px;cursor:pointer}
.pgrid button:hover{background:var(--acc);color:var(--dk)}

/* ===== OVERLAYS (profile / admin) ===== */
.ovl{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.ovl.show{display:flex}
.card{width:340px;background:var(--bg2);border:1px solid rgba(247,130,14,.45);border-radius:16px;overflow:hidden;
  box-shadow:0 16px 50px rgba(0,0,0,.6);animation:pop .18s ease}
.card .chead{height:64px;background:linear-gradient(180deg,var(--or1),var(--or2));position:relative}
.card .cav{position:absolute;bottom:-26px;right:18px;border:4px solid var(--bg2);border-radius:50%}
.card .cx{position:absolute;top:10px;left:10px;width:30px;height:30px;border:none;border-radius:8px;
  background:rgba(20,10,2,.55);color:#fff;font-size:14px;cursor:pointer}
.card .cx:hover{background:#B4231C}
.card .cbody{padding:34px 18px 16px}
.card .cname{font-weight:900;font-size:19px;color:#fff;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .crow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.card .crow:last-of-type{border-bottom:none}
.card .cl{color:var(--mut)}
.card .cv{color:var(--tx);font-weight:700;max-width:190px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cv.ok{color:var(--on)} .card .cv.no{color:var(--admin)}
.cbtns{display:flex;gap:8px;margin-top:12px}
.cbtn{flex:1;border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;background:#1a1922;color:#fff}
.cbtn:hover{background:#232230}
.cbtn.pri{background:var(--acc);color:var(--dk)}
.cbtn.pri:hover{background:#ff9a2a}

/* admin modal */
.card textarea{width:100%;height:110px;background:#1a1922;border:1px solid rgba(247,130,14,.3);border-radius:10px;
  color:var(--tx);font-size:14px;padding:10px;resize:none;outline:none;font-family:inherit}
.card .csub{color:var(--mut);font-size:12.5px;margin:4px 0 10px;line-height:1.5}

/* toast */
.toast{position:absolute;bottom:84px;right:50%;transform:translateX(50%);background:#0f0e12;color:var(--tx);
  border:1px solid rgba(247,130,14,.5);border-radius:12px;padding:10px 20px;font-size:14px;font-weight:700;
  z-index:60;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.show{display:block;animation:pop .18s ease}
</style>
</head>
<body>
<div class="win">
  <!-- HEADER -->
  <div class="hdr">
    <div class="brand"><span class="logo">DRIVE</span><span class="ttl">الشات</span><span class="ic">💬</span></div>
    <div class="hctrl">
      <label class="opac">شفافية <input id="opac" type="range" min="35" max="100" value="100"></label>
      <button class="hbtn" id="adminbtn" title="تواصل مع الإدارة" onclick="openAdmin()">📨</button>
      <button class="hbtn" id="notifbtn" title="فقاعات الإشعارات" onclick="toggleNotif()">🔔</button>
      <button class="hbtn xbtn" onclick="sendToLua('close')">✕</button>
    </div>
  </div>

  <div class="hint">للإرسال ENTER · للإغلاق ESC أو ✕ · اضغط أي عضو لعرض حسابه · اكتب /link لربط الديسكورد</div>

  <!-- BODY -->
  <div class="body">
    <!-- SIDEBAR -->
    <div class="side">
      <div class="sh">👥 الأعضاء <span class="n" id="memcount">(0)</span></div>
      <div class="srch"><span class="mag">🔍</span><input id="memsearch" placeholder="ابحث عن عضو..." oninput="renderMembers()"></div>
      <div class="mlist" id="mlist"></div>
    </div>

    <!-- CHAT -->
    <div class="main">
      <div class="msgs" id="msgs"></div>
    </div>
  </div>

  <!-- PICKER PANEL -->
  <div class="panel" id="panel"></div>

  <!-- FOOTER / INPUT -->
  <div class="foot">
    <div class="picks">
      <button class="pbtn" id="p-emoji" onclick="togglePanel('emoji')">😀</button>
      <button class="pbtn" id="p-stick" onclick="togglePanel('stick')">🖼️</button>
      <button class="pbtn" id="p-gif"   onclick="togglePanel('gif')">GIF</button>
      <button class="pbtn" id="p-phr"   onclick="togglePanel('phr')">💬</button>
    </div>
    <div class="inwrap">
      <input id="msgin" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter')doSend()">
      <button class="send" onclick="doSend()">➤</button>
    </div>
  </div>

  <!-- PROFILE POPUP -->
  <div class="ovl" id="profovl" onclick="if(event.target===this)closeProfile()">
    <div class="card">
      <div class="chead"><button class="cx" onclick="closeProfile()">✕</button><div class="cav" id="profav"></div></div>
      <div class="cbody">
        <div class="cname" id="profname"></div>
        <div style="height:8px"></div>
        <div class="crow"><span class="cl">🏆 المستوى</span><span class="cv" id="proflevel"></span></div>
        <div class="crow"><span class="cl">🔗 الديسكورد</span><span class="cv" id="profdisc"></span></div>
        <div class="crow"><span class="cl">🚗 السيارة</span><span class="cv" id="profcar"></span></div>
        <div class="crow"><span class="cl">📅 أول دخول</span><span class="cv" id="proffirst"></span></div>
        <div class="crow"><span class="cl">🎮 إجمالي اللعب</span><span class="cv" id="proftotal"></span></div>
        <div class="crow"><span class="cl">⏱️ مدة التواجد الآن</span><span class="cv" id="profdur"></span></div>
        <div class="crow"><span class="cl">📍 بعده عنك</span><span class="cv" id="profdist"></span></div>
        <div class="crow"><span class="cl">💨 السرعة</span><span class="cv" id="profspeed"></span></div>
        <div class="cbtns">
          <button class="cbtn pri" id="profmention">@ منشن</button>
          <button class="cbtn" onclick="closeProfile()">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTACT ADMIN MODAL -->
  <div class="ovl" id="adminovl" onclick="if(event.target===this)closeAdmin()">
    <div class="card">
      <div class="chead"><button class="cx" onclick="closeAdmin()">✕</button>
        <div style="display:flex;align-items:center;height:100%;padding:0 18px;font-weight:900;font-size:18px;color:var(--dk)">📨 تواصل مع الإدارة</div>
      </div>
      <div class="cbody" style="padding-top:16px">
        <div class="csub">رسالتك توصل مباشرة لروم الإدارة في الديسكورد مع اسمك داخل اللعبة.</div>
        <textarea id="admintxt" placeholder="اكتب رسالتك للإدارة..."></textarea>
        <div class="cbtns">
          <button class="cbtn pri" onclick="sendAdmin()">إرسال 📤</button>
          <button class="cbtn" onclick="closeAdmin()">إلغاء</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   DRIVE CHAT v2 — front-end
   Lua→JS : browser:sendAsync('EVENT', data)  =>  window.DriveChat[EVENT]
   JS→Lua : AC.send('Drivechat', 'command:...')
   ============================================================ */

/* ---------- CSP bridge (JS -> Lua) ----------
   كل أمر يترقّم "<رقم>:<الأمر>" وينرسل على كل القنوات المتاحة + عنوان الصفحة.
   Lua يمنع التكرار بالرقم — فما يهم كم قناة وصلت. */
let TSEQ = 0, TQUEUE = [], TBUSY = false;
function pumpTitle(){
  if(TBUSY || !TQUEUE.length) return;
  TBUSY = true;
  document.title = 'DRIVECHAT:' + TQUEUE.shift();
  setTimeout(()=>{ TBUSY = false; pumpTitle(); }, 80);
}
function sendToLua(msg){
  const payload = (++TSEQ) + ':' + String(msg);
  try{ if(window.AC && AC.sendAsync) AC.sendAsync('Drivechat', payload); }catch(e){}
  try{ if(window.AC && AC.send) AC.send('Drivechat', payload); }catch(e){}
  try{ if(window.external && window.external.invoke) window.external.invoke(payload); }catch(e){}
  TQUEUE.push(payload); pumpTitle();
}

/* ---------- state ---------- */
let MEMBERS = [];        // {name,isMe,status,rank,discord,avatar,car,dur,dist,speed}
let ME = "أنت";
let NOTIFS = true;
let ADMIN_ENABLED = true;
let MEMBERS_AT = Date.now();   // وقت آخر تحديث للأعضاء (لتحريك مدة التواجد)
let MYME = null;               // بياناتي أنا من قائمة الأعضاء (أفتار/رتبة) — تنعرض على رسايلي
const KNOWN_RANK = {admin:'ADMIN', mod:'MOD', vip:'VIP'};
const AVC = ['#DB4C3C','#3D85E0','#8757D4','#2E9E8C','#E08924','#578F4C','#CC598C','#5470BD'];

const EMOJIS = "😀 😁 😂 🤣 😊 😍 😎 😭 😡 👍 👎 🙏 🔥 💯 🎉 👑 🏁 🚗 💨 ⚡ ❤️ 🧡 💛 💚 💙 💜 🤍 🖤 😴 🤔 😏 😜 🥳 😱 🤯 🫡 🤝 ✌️ 🤙 👀 💪 🙌 😅 😬 🥶 🤗 😇 🤪 😤 🫠".split(' ');
const PHRASES = ['سلام عليكم','وعليكم السلام','مدارس','عداك العيب','كفوووو','ولا شيء يا كنق','لعيونك','لعيونكم'];
let STICKERS = ['https://pbs.twimg.com/media/G7gyUn4WMAAafxA.jpg','https://i1.sndcdn.com/artworks-kpz9WCWcGJ9AFL58-10R0yA-t500x500.jpg','https://i.pinimg.com/236x/9c/b9/17/9cb917337ebedb3dda74c974bde47dc0.jpg','https://i.ytimg.com/vi/h5f9rl2Y5F8/oar2.jpg','https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEibrYm5kiGVQRHXjNHVTJg1U8X97tUKCHc5K2r2rA4_J0xo8ALquNxqJK3VMxbI0N6mlcw_XguUtshae1huBmBNNe8cwh6_YyU9cVcZYa3_xtf8GnO2odL2vzqcWp31WjuCbkGL4r8BT1AufOl99KqxR27ITeULa6749SXfQFGFzJ3iW7udeFXz9ifywA/s640/IMG_20220925_202534_772.jpg','https://i.imgur.com/9uijEsa.png','https://pbs.twimg.com/media/HEOexNwWkAArXOi.jpg','https://i.imgur.com/4wYJO7H.png','https://i.imgur.com/GvkKdq6.png'];  // تنعبى من Lua
let GIFS = ['https://media.wired.com/photos/593221d8b8eb31692072dedf/3:2/w_2560%2Cc_limit/MJ-giphy.gif','https://www.thisiscolossal.com/wp-content/uploads/2014/03/120430.gif'];      // تنعبى من Lua

/* ---------- helpers ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))%100000;return h;}
function initials(n){n=n||'?';return /^[A-Za-z]/.test(n)?n.slice(0,2).toUpperCase():[...n][0];}
function avatarHTML(m,size){
  const s=size||40;
  if(m.avatar) return `<div class="av" style="width:${s}px;height:${s}px;background-image:url('${m.avatar}')"></div>`;
  const c=AVC[hash(m.rawName||m.name||'?')%AVC.length];
  return `<div class="av" style="width:${s}px;height:${s}px;background:${m.srv?'#0a0a0c':c}${m.srv?';border:2px solid var(--acc);color:var(--acc)':''};font-size:${Math.round(s*0.38)}px">${m.srv?'D':initials(m.rawName||m.name)}</div>`;
}
function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function badgeHTML(rank,color){
  if(!rank) return '';
  const k=String(rank).toLowerCase();
  if(color&&/^#[0-9a-fA-F]{6}$/.test(color)){
    // لون الرتبة من البوت — النص أبيض أو غامق حسب فتوحة اللون
    const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
    const tx=(0.299*r+0.587*g+0.114*b)>150?'#1a1200':'#fff';
    return `<span class="badge" style="background:${color};color:${tx}">${esc(String(rank).toUpperCase())}</span>`;
  }
  if(KNOWN_RANK[k]) return `<span class="badge b-${k}">${KNOWN_RANK[k]}</span>`;
  return `<span class="badge b-rank">${esc(String(rank).toUpperCase())}</span>`;
}
function fmtDur(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if(h>0) return h+'س '+m+'د';
  if(m>0) return m+'د '+s+'ث';
  return s+'ث';
}
function fmtDate(ms){
  try{ const d=new Date(Number(ms)); if(isNaN(d)) return '—';
    return d.toLocaleDateString('ar',{year:'numeric',month:'short',day:'numeric'}); }catch(e){return '—';}
}
function fmtPlaytime(mins){
  const h=Math.floor(mins/60), m=Math.round(mins%60);
  if(h>0) return h+' ساعة'+(m>0?(' و'+m+' د'):'');
  return m+' دقيقة';
}
function fmtDist(m){
  if(m==null) return '—';
  if(m>=1000) return (m/1000).toFixed(1)+' كم';
  return Math.round(m)+' م';
}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function toast(t,ms){
  const el=document.getElementById('toast');
  el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'), ms||2500);
}

/* ---------- members ---------- */
function rankOrder(r){const k=String(r||'').toLowerCase();return k==='admin'?0:k==='mod'?1:k==='vip'?2:r?3:4;}
function renderMembers(){
  const q=(document.getElementById('memsearch').value||'').toLowerCase();
  const list=document.getElementById('mlist');
  document.getElementById('memcount').textContent='('+MEMBERS.length+')';
  list.innerHTML='';
  const sorted=[...MEMBERS].sort((a,b)=>{
    if(a.isMe!==b.isMe) return a.isMe?-1:1;
    const r=rankOrder(a.rank)-rankOrder(b.rank);
    if(r!==0) return r;
    return (a.name||'').localeCompare(b.name||'');
  });
  sorted.filter(m=>!q||(m.name||'').toLowerCase().includes(q)).forEach(m=>{
    const row=document.createElement('div');row.className='mrow';
    const av=avatarHTML({...m,rawName:m.name},40).replace('</div>',`<span class="dot ${m.status||'on'}"></span></div>`);
    const dl=m.discord?'<span class="dlink" title="مرتبط بالديسكورد">🔗</span>':'';
    const sub=m.isMe?'أنت':((m.speed!=null?('💨 '+m.speed+' كم/س'):'متصل'));
    row.innerHTML=`${av}<div class="mi"><div class="mn">${esc(m.name)} ${dl} ${badgeHTML(m.rank,m.rankColor)}</div><div class="ms">${sub}</div></div>`;
    row.onclick=()=>openProfile(m.name);
    list.appendChild(row);
  });
}

/* ---------- profile popup ---------- */
let PROF_NAME=null;
function memberByName(n){return MEMBERS.find(m=>m.name===n);}
function openProfile(name){
  PROF_NAME=name;
  document.getElementById('profovl').classList.add('show');
  refreshProfile();
  const btn=document.getElementById('profmention');
  btn.onclick=()=>{const i=document.getElementById('msgin');i.value+='@'+name+' ';closeProfile();i.focus();};
}
function closeProfile(){PROF_NAME=null;document.getElementById('profovl').classList.remove('show');}
function refreshProfile(){
  if(!PROF_NAME) return;
  const m=memberByName(PROF_NAME);
  if(!m){closeProfile();return;}
  document.getElementById('profav').innerHTML=avatarHTML({...m,rawName:m.name},64);
  const lvChip=(Number(m.level)>0)?`<span class="badge b-rank">LV ${Number(m.level)}</span>`:'';
  document.getElementById('profname').innerHTML=`${esc(m.name)} ${m.isMe?'<span style="color:var(--mut);font-size:13px">(أنت)</span>':''} ${badgeHTML(m.rank,m.rankColor)} ${lvChip}`;
  const d=document.getElementById('profdisc');
  if(m.discord){d.textContent=(typeof m.discord==='string')?('مرتبط ✓ '+m.discord):'مرتبط ✓';d.className='cv ok';}
  else{d.textContent='غير مرتبط ✗';d.className='cv no';}
  document.getElementById('profcar').textContent=m.car||'—';
  // المستوى + مسمّاه
  const lv=Number(m.level)||0;
  document.getElementById('proflevel').textContent=lv>0?('LV '+lv+(m.levelTitle?(' — '+m.levelTitle):'')):'جديد';
  // أول دخول
  document.getElementById('proffirst').textContent=m.firstSeen?fmtDate(m.firstSeen):'—';
  // إجمالي اللعب (دقايق -> ساعات)
  const tm=Number(m.totalMinutes)||0;
  document.getElementById('proftotal').textContent=tm>0?fmtPlaytime(tm):'—';
  const liveDur=(m.dur||0)+Math.floor((Date.now()-MEMBERS_AT)/1000);
  document.getElementById('profdur').textContent=fmtDur(liveDur);
  document.getElementById('profdist').textContent=m.isMe?'—':fmtDist(m.dist);
  document.getElementById('profspeed').textContent=(m.speed!=null?m.speed:0)+' كم/س';
  // بروفايلك أنت + غير مرتبط -> زر يبدأ الربط مباشرة
  const mb=document.getElementById('profmention');
  if(m.isMe && !m.discord){
    mb.textContent='🔗 اربط حسابك بالديسكورد';
    mb.onclick=()=>{ sendToLua('send:/link'); closeProfile(); toast('طلبنا لك كود الربط — بيوصلك برسالة بالشات 🔗'); };
  }else if(m.isMe){
    mb.textContent='مرتبط ✓';
    mb.onclick=()=>closeProfile();
  }
}
setInterval(refreshProfile,1000);

/* ---------- notifications toggle ---------- */
function applyNotifBtn(){
  const b=document.getElementById('notifbtn');
  b.textContent=NOTIFS?'🔔':'🔕';
  b.classList.toggle('off',!NOTIFS);
  b.title=NOTIFS?'فقاعات الإشعارات: شغّالة':'فقاعات الإشعارات: مقفلة';
}
function toggleNotif(){
  NOTIFS=!NOTIFS; applyNotifBtn();
  sendToLua('notif:'+(NOTIFS?'1':'0'));
  toast(NOTIFS?'فقاعات الإشعارات: تشتغل لما تسكّر الشات 🔔':'فقاعات الإشعارات: مقفلة 🔕');
}

/* ---------- contact admin ---------- */
function openAdmin(){
  if(!ADMIN_ENABLED){toast('التواصل مع الإدارة غير مفعّل حالياً');return;}
  document.getElementById('adminovl').classList.add('show');
  setTimeout(()=>document.getElementById('admintxt').focus(),50);
}
function closeAdmin(){document.getElementById('adminovl').classList.remove('show');document.getElementById('admintxt').value='';}
function sendAdmin(){
  const t=document.getElementById('admintxt').value.trim();
  if(!t)return;
  sendToLua('admin:'+t);
  closeAdmin();
  toast('جاري إرسال رسالتك للإدارة… ⏳');
}

/* ---------- messages ---------- */
const msgsEl=document.getElementById('msgs');
function addMessage(m){
  // m = {name, text?, sticker?, rank?, mine?, srv?, time?, rawName?, avatar?}
  const near=msgsEl.scrollTop+msgsEl.clientHeight>=msgsEl.scrollHeight-40;
  const row=document.createElement('div');
  row.className='msg'+(m.srv?' sys':m.mine?' mine':'');
  const time=m.time||now();
  let inner='';
  if(m.sticker){ inner=`<img class="stick" src="${m.sticker}">`; }
  else { inner=esc(m.text||''); }
  if(m.srv){
    row.innerHTML=`<div class="mbody"><div class="mhead"><span class="mname" style="cursor:default">DRIVE SYSTEM</span><span class="mtime">${time}</span></div><div class="bub">${inner}</div></div>`;
  }else{
    row.innerHTML=`<div class="mav">${avatarHTML(m,40)}</div>
      <div class="mbody"><div class="mhead"><span class="mname">${esc(m.name)}</span>${badgeHTML(m.rank,m.rankColor)}<span class="mtime">${time}</span></div>
      <div class="bub">${inner}</div></div>`;
    const nm=row.querySelector('.mname');
    if(nm && !m.mine) nm.onclick=()=>openProfile(m.rawName||m.name);
  }
  msgsEl.appendChild(row);
  while(msgsEl.children.length>120) msgsEl.removeChild(msgsEl.firstChild);
  if(near) msgsEl.scrollTop=msgsEl.scrollHeight;
}

/* ---------- send ---------- */
function myMsg(extra){
  const b={name:ME,mine:true,time:now()};
  if(MYME){ b.avatar=MYME.avatar||undefined; b.rank=MYME.rank||undefined; b.rankColor=MYME.rankColor||undefined; b.rawName=MYME.name; }
  return Object.assign(b,extra);
}
function doSend(){
  const i=document.getElementById('msgin');const t=i.value.trim();
  if(!t)return;
  if(!t.startsWith('/')) addMessage(myMsg({text:t}));   // الأوامر (/link ...) ما تنعرض كرسالة
  sendToLua('send:'+t);
  i.value='';i.focus();
}
function sendSticker(url){ addMessage(myMsg({sticker:url})); sendToLua('stick:'+url); togglePanel(curPanel); }

/* ---------- picker panel ---------- */
let curPanel=null;
function togglePanel(k){
  const p=document.getElementById('panel');
  ['emoji','stick','gif','phr'].forEach(x=>document.getElementById('p-'+x).classList.toggle('on',x===k&&curPanel!==k));
  if(curPanel===k){curPanel=null;p.classList.remove('show');return;}
  curPanel=k;p.classList.add('show');
  if(k==='emoji'){p.innerHTML='<div class="egrid">'+EMOJIS.map(e=>`<span onclick="ins('${e}')">${e}</span>`).join('')+'</div>';}
  else if(k==='stick'){p.innerHTML=STICKERS.length?'<div class="sgrid">'+STICKERS.map(u=>`<img src="${u}" loading="lazy" onclick="sendSticker('${u}')">`).join('')+'</div>':'<div style="color:var(--mut);text-align:center;padding:14px">لا توجد ستيكرز</div>';}
  else if(k==='gif'){p.innerHTML=GIFS.length?'<div class="sgrid g3">'+GIFS.map(u=>`<img src="${u}" loading="lazy" onclick="sendSticker('${u}')">`).join('')+'</div>':'<div style="color:var(--mut);text-align:center;padding:14px">لا توجد GIF</div>';}
  else if(k==='phr'){p.innerHTML='<div class="pgrid">'+PHRASES.map(t=>`<button onclick="phr('${t}')">${t}</button>`).join('')+'</div>';}
}
function ins(e){const i=document.getElementById('msgin');i.value+=e;i.focus();}
function phr(t){addMessage(myMsg({text:t}));sendToLua('send:'+t);togglePanel('phr');}

/* ---------- keyboard ---------- */
/* الشات المفتوح = وضع كتابة كامل (الكيبورد كله للشات) — الإغلاق: ESC أو ✕ أو كليك برا النافذة */

/* ============================================================
   Lua -> JS  (browser:sendAsync('EVENT', data))
   ============================================================ */
/* الأسماء كلها بادئة dc — عشان نقدر نعرّفها كدوال عالمية بأمان بدون ما نكسر window.focus/blur */
const HANDLERS = {
  dcMessage: (m)=>{ m=m||{}; addMessage({...m, text:(m.text===false?undefined:m.text), sticker:(m.sticker===false?undefined:m.sticker), avatar:(m.avatar===false?undefined:m.avatar), rankColor:(m.rankColor===false?undefined:m.rankColor)}); },
  dcClear:   ()=>{msgsEl.innerHTML='';},
  dcMembers: (list)=>{MEMBERS=list||[];MEMBERS_AT=Date.now();MYME=MEMBERS.find(m=>m.isMe)||MYME;renderMembers();refreshProfile();},
  dcStickers:(list)=>{if(list&&list.length)STICKERS=list;},
  dcGifs:    (list)=>{if(list&&list.length)GIFS=list;},
  dcInit:    (d)=>{
    d=d||{};
    if(d.me){ME=d.me;}
    NOTIFS=(d.notifs===undefined)?true:!!Number(d.notifs);
    ADMIN_ENABLED=(d.adminEnabled===undefined)?true:!!Number(d.adminEnabled);
    document.getElementById('adminbtn').style.display=ADMIN_ENABLED?'flex':'none';
    applyNotifBtn();
    if(d.opacity){const o=Math.max(35,Math.min(100,Number(d.opacity)));document.getElementById('opac').value=o;document.querySelector('.win').style.opacity=o/100;}
    sendToLua('ack');   // نأكد لـ Lua إن قناة الاستقبال شغّالة
  },
  dcFocus:   ()=>{ setTimeout(()=>document.getElementById('msgin').focus(),30); },
  dcBlur:    ()=>{ try{document.activeElement.blur();}catch(e){} closeProfile(); closeAdmin(); if(curPanel)togglePanel(curPanel); },
  dcAdminAck:(d)=>{ d=d||{}; if(d.ok)toast('تم إرسال رسالتك للإدارة ✓'); else toast('تعذر الإرسال — كلم الإدارة بالديسكورد'); },
};
window.DriveChat = HANDLERS;

/* استقبال من Lua على كل القنوات المحتملة (يختلف حسب نسخة CSP): */
function bindIncoming(name, fn){
  const wrapped = (d)=>{ if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){} } try{ fn(d); }catch(e){} };
  window[name] = wrapped;                                              // نداء دالة عالمية
  try{ if(window.AC && AC.on)        AC.on(name, wrapped); }catch(e){}
  try{ if(window.AC && AC.onReceive) AC.onReceive(name, wrapped); }catch(e){}
  document.addEventListener(name, e=>wrapped(e && e.detail !== undefined ? e.detail : undefined));
}
for(const k in HANDLERS) bindIncoming(k, HANDLERS[k]);

/* قناة الطوارئ: Lua ينفذ DCRX('base64-json') مباشرة داخل الصفحة */
window.DCRX = function(b){
  try{
    const json = decodeURIComponent(escape(atob(b)));
    const p = JSON.parse(json);
    if(p && p.e && HANDLERS[p.e]) HANDLERS[p.e](p.d);
  }catch(e){}
};

document.getElementById('opac').oninput=function(){
  document.querySelector('.win').style.opacity=this.value/100; sendToLua('opac:'+this.value);
};

applyNotifBtn();

/* أعلم Lua إن الصفحة جاهزة */
window.addEventListener('load',()=>{ document.title='DRIVECHAT:ready'; setTimeout(()=>sendToLua('ready'),150); });
</script>
