<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIVE CHAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --or1:#FBA018; --or2:#F26A05; --acc:#F7820E; --acc-soft:rgba(247,130,14,.16);
  --bg:#141317; --bg2:#0F0E12; --side:#111015; --chat:#17161B;
  --bub-o:#201F26; --bub-m:#241a0f; --line:rgba(255,255,255,.06);
  --tx:#F3F1F0; --mut:#8C8A93; --dk:#160C02;
  --on:#3FB950; --busy:#F7820E; --off:#5B6069;
  --admin:#E5484D; --mod:#4F9CF9; --vip:#F5C518;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',system-ui,'Segoe UI',sans-serif}
html,body{height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(247,130,14,.45);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.win{width:100%;height:100%;max-width:1180px;max-height:940px;display:flex;flex-direction:column;
  background:var(--bg);border:1px solid rgba(247,130,14,.35);border-radius:18px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.55)}

/* ===== HEADER ===== */
.hdr{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  background:linear-gradient(180deg,var(--or1),var(--or2));position:relative}
.hdr::after{content:"";position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.10)}
.hdr>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{font-weight:900;font-style:italic;font-size:26px;color:var(--dk);letter-spacing:.5px}
.brand .ttl{font-weight:700;font-size:18px;color:#1a0f04}
.brand .ic{font-size:20px}
.hctrl{display:flex;align-items:center;gap:14px}
.opac{display:flex;align-items:center;gap:8px;color:#2a1704;font-weight:500;font-size:13px}
.opac input{accent-color:#1a0f04;width:96px}
.xbtn{width:36px;height:36px;border:none;border-radius:9px;background:rgba(20,10,2,.55);color:#fff;
  font-size:16px;cursor:pointer;transition:.15s}
.xbtn:hover{background:#B4231C}

/* ===== HINT ===== */
.hint{margin:10px auto 4px;padding:7px 20px;background:rgba(8,8,10,.9);border-radius:16px;color:var(--mut);
  font-size:13px;text-align:center;width:fit-content}

/* ===== BODY ===== */
.body{flex:1;display:flex;min-height:0;padding:6px 14px 0}

/* sidebar */
.side{width:236px;flex:0 0 236px;background:var(--side);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;margin-left:14px;overflow:hidden}
.side .sh{padding:12px 14px 6px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:16px}
.side .sh .n{color:var(--mut);font-weight:500;font-size:14px}
.srch{margin:4px 12px 8px;display:flex;align-items:center;gap:8px;background:#191820;border-radius:9px;padding:0 12px}
.srch input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:13px;padding:9px 0}
.srch input::placeholder{color:var(--mut)}
.srch .mag{color:var(--mut);font-size:13px}
.mlist{flex:1;overflow-y:auto;padding:2px 8px}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;cursor:pointer;transition:.12s}
.mrow:hover{background:rgba(255,255,255,.05)}
.av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:#fff;position:relative;overflow:hidden;background-size:cover;background-position:center}
.av .dot{position:absolute;bottom:-1px;left:-1px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--side)}
.dot.on{background:var(--on)} .dot.busy{background:var(--busy)} .dot.off{background:var(--off)}
.mrow .mi{flex:1;min-width:0}
.mrow .mn{font-weight:700;font-size:14px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.mrow .ms{font-size:12px;color:var(--mut)}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;color:#fff;letter-spacing:.3px}
.b-admin{background:var(--admin)} .b-mod{background:var(--mod)} .b-vip{background:var(--vip);color:#1a1200}
.sall{margin:8px 12px;padding:9px;border:none;border-radius:10px;background:#1b1a22;color:#cfcdd6;
  font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.sall:hover{background:#232230}

/* chat */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;overflow-y:auto;background:var(--chat);border:1px solid var(--line);border-radius:12px;padding:14px 12px}
.msg{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.msg.mine{flex-direction:row-reverse}
.msg.sys{justify-content:center}
.msg .mav{flex:0 0 40px}
.mbody{max-width:66%;min-width:0}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msg.mine .mhead{flex-direction:row-reverse}
.mname{font-weight:700;font-size:14px;color:var(--acc)}
.mtime{font-size:11px;color:var(--mut)}
.bub{background:var(--bub-o);border-radius:12px;padding:9px 13px;color:var(--tx);font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.mine .bub{background:var(--bub-m);border-right:3px solid var(--acc)}
.msg.sys .bub{background:#100F14;color:#f0c8a0;text-align:center;border:1px solid rgba(247,130,14,.25)}
.bub img.stick{max-width:150px;max-height:150px;border-radius:10px;display:block}

/* input row */
.foot{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.picks{display:flex;gap:8px}
.pbtn{width:42px;height:42px;border:none;border-radius:11px;background:#1a1922;color:#fff;font-size:18px;cursor:pointer;transition:.12s}
.pbtn:hover{background:rgba(255,255,255,.10)} .pbtn.on{background:var(--acc);color:var(--dk)}
.inwrap{flex:1;display:flex;align-items:center;background:#1a1922;border:1px solid rgba(247,130,14,.25);border-radius:12px;padding:0 6px 0 14px}
.inwrap input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;padding:13px 0}
.inwrap input::placeholder{color:var(--mut)}
.send{width:46px;height:38px;border:none;border-radius:10px;background:var(--acc);color:var(--dk);font-size:18px;cursor:pointer;transition:.12s}
.send:hover{background:#ff9a2a}

/* picker panel */
.panel{margin:0 14px;background:var(--bg2);border:1px solid rgba(247,130,14,.4);border-radius:12px;
  padding:10px;max-height:210px;overflow-y:auto;display:none}
.panel.show{display:block}
.egrid{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.egrid span{font-size:20px;text-align:center;cursor:pointer;border-radius:6px;padding:4px 0}
.egrid span:hover{background:var(--acc-soft)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:#1a1922}
.sgrid img:hover{outline:2px solid var(--acc)}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pgrid button{border:none;border-radius:9px;background:#1a1922;color:#fff;font-size:14px;padding:11px;cursor:pointer}
.pgrid button:hover{background:var(--acc);color:var(--dk)}
</style>
</head>
<body>
<div class="win">
  <!-- HEADER -->
  <div class="hdr">
    <div class="brand"><span class="logo">DRIVE</span><span class="ttl">الشات</span><span class="ic">💬</span></div>
    <div class="hctrl">
      <label class="opac">شفافية <input id="opac" type="range" min="35" max="100" value="100"></label>
      <button class="xbtn" onclick="sendToLua('close')">✕</button>
    </div>
  </div>

  <div class="hint">للإرسال اضغط ENTER · C لإخفاء الشات</div>

  <!-- BODY -->
  <div class="body">
    <!-- SIDEBAR -->
    <div class="side">
      <div class="sh">👥 الأعضاء <span class="n" id="memcount">(0)</span></div>
      <div class="srch"><span class="mag">🔍</span><input id="memsearch" placeholder="ابحث عن عضو..." oninput="renderMembers()"></div>
      <div class="mlist" id="mlist"></div>
      <button class="sall" onclick="document.getElementById('memsearch').value='';renderMembers()">👥 عرض جميع الأعضاء</button>
    </div>

    <!-- CHAT -->
    <div class="main">
      <div class="msgs" id="msgs"></div>
    </div>
  </div>

  <!-- PICKER PANEL -->
  <div class="panel" id="panel"></div>

  <!-- FOOTER / INPUT -->
  <div class="foot">
    <div class="picks">
      <button class="pbtn" id="p-emoji" onclick="togglePanel('emoji')">😀</button>
      <button class="pbtn" id="p-stick" onclick="togglePanel('stick')">🖼️</button>
      <button class="pbtn" id="p-gif"   onclick="togglePanel('gif')">GIF</button>
      <button class="pbtn" id="p-phr"   onclick="togglePanel('phr')">💬</button>
    </div>
    <div class="inwrap">
      <input id="msgin" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter')doSend()">
      <button class="send" onclick="doSend()">➤</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DRIVE CHAT — front-end
   يتصل بـ Lua عبر:  Lua→JS: browser:sendAsync('EVENT', data)
                     JS→Lua: AC.send('Drivechat', 'command:...')
   ============================================================ */

/* ---------- CSP bridge (JS -> Lua) ---------- */
function sendToLua(msg){
  try{ if(window.AC && AC.send){ AC.send('Drivechat', String(msg)); return; } }catch(e){}
  try{ if(window.external && window.external.invoke){ window.external.invoke(String(msg)); } }catch(e){}
}

/* ---------- state ---------- */
let MEMBERS = [];   // {name, status:'on'|'busy'|'off', rank:'admin'|'mod'|'vip'|'', avatar}
let ME = "أنت";
const RANK_LABEL = {admin:'ADMIN', mod:'MOD', vip:'VIP'};
const AVC = ['#DB4C3C','#3D85E0','#8757D4','#2E9E8C','#E08924','#578F4C','#CC598C','#5470BD'];

const EMOJIS = "😀 😁 😂 🤣 😊 😍 😎 😭 😡 👍 👎 🙏 🔥 💯 🎉 👑 🏁 🚗 💨 ⚡ ❤️ 🧡 💛 💚 💙 💜 🤍 🖤 😴 🤔 😏 😜 🥳 😱 🤯 🫡 🤝 ✌️ 🤙 👀 💪 🙌 😅 😬 🥶 🤗 😇 🤪 😤 🫠".split(' ');
const PHRASES = ['سلام عليكم','وعليكم السلام','مدارس','عداك العيب','كفوووو','ولا شيء يا كنق','لعيونك','لعيونكم'];
/* ستيكرز/GIF — روابط مباشرة (المتصفح يعرض الـ GIF متحرك تلقائياً) */
let STICKERS = [
  'https://i.imgur.com/WOV2nwa.png',
  'https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcHdkam8yZXpsNjE3a2R1ZzJubWYwNnN3aXk1eDFlcWZ4dXpqbDlkbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7kn27lnYSAE9O/giphy.gif'
];
let GIFS = [
  'https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcHdkam8yZXpsNjE3a2R1ZzJubWYwNnN3aXk1eDFlcWZ4dXpqbDlkbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7kn27lnYSAE9O/giphy.gif'
];

/* ---------- helpers ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))%100000;return h;}
function initials(n){n=n||'?';return /^[A-Za-z]/.test(n)?n.slice(0,2).toUpperCase():[...n][0];}
function avatarHTML(m,size){
  const s=size||40;
  if(m.avatar) return `<div class="av" style="width:${s}px;height:${s}px;background-image:url('${m.avatar}')"></div>`;
  const c=AVC[hash(m.rawName||m.name||'?')%AVC.length];
  return `<div class="av" style="width:${s}px;height:${s}px;background:${m.srv?'#0a0a0c':c}${m.srv?';border:2px solid var(--acc);color:var(--acc)':''}">${m.srv?'D':initials(m.rawName||m.name)}</div>`;
}
function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---------- members ---------- */
function renderMembers(){
  const q=(document.getElementById('memsearch').value||'').toLowerCase();
  const list=document.getElementById('mlist');
  const on=MEMBERS.length;
  document.getElementById('memcount').textContent='('+on+')';
  list.innerHTML='';
  MEMBERS.filter(m=>!q||m.name.toLowerCase().includes(q)).forEach(m=>{
    const row=document.createElement('div');row.className='mrow';
    const av=avatarHTML(m,40).replace('class="av"',`class="av"`);
    const badge=m.rank&&RANK_LABEL[m.rank]?`<span class="badge b-${m.rank}">${RANK_LABEL[m.rank]}</span>`:'';
    const st=m.status==='on'?'متصل':m.status==='busy'?'مشغول':'غير متصل';
    row.innerHTML=`${av.replace('</div>',`<span class="dot ${m.status}"></span></div>`)}
      <div class="mi"><div class="mn">${esc(m.name)} ${badge}</div><div class="ms">${st}</div></div>`;
    row.onclick=()=>{const i=document.getElementById('msgin');i.value+='@'+m.name+' ';i.focus();};
    list.appendChild(row);
  });
}

/* ---------- messages ---------- */
const msgsEl=document.getElementById('msgs');
function gifify(text){
  // [gif]URL[/gif] -> صورة
  return esc(text).replace(/\[gif\](.*?)\[\/gif\]/g,(_,u)=>`<img class="stick" src="${u}">`);
}
function addMessage(m){
  // m = {name, text?, sticker?, rank?, mine?, srv?, time?, rawName?, avatar?}
  const near=msgsEl.scrollTop+msgsEl.clientHeight>=msgsEl.scrollHeight-40;
  const row=document.createElement('div');
  row.className='msg'+(m.srv?' sys':m.mine?' mine':'');
  const time=m.time||now();
  let inner='';
  if(m.sticker){ inner=`<img class="stick" src="${m.sticker}">`; }
  else { inner=gifify(m.text||''); }
  if(m.srv){
    row.innerHTML=`<div class="mbody"><div class="mhead"><span class="mname">DRIVE SYSTEM</span><span class="mtime">${time}</span></div><div class="bub">${inner}</div></div>`;
  }else{
    const badge=m.rank&&RANK_LABEL[m.rank]?`<span class="badge b-${m.rank}">${RANK_LABEL[m.rank]}</span>`:'';
    row.innerHTML=`<div class="mav">${avatarHTML(m,40)}</div>
      <div class="mbody"><div class="mhead"><span class="mname">${esc(m.name)}</span>${badge}<span class="mtime">${time}</span></div>
      <div class="bub">${inner}</div></div>`;
  }
  msgsEl.appendChild(row);
  if(near) msgsEl.scrollTop=msgsEl.scrollHeight;
}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

/* ---------- send ---------- */
function doSend(){
  const i=document.getElementById('msgin');const t=i.value.trim();
  if(!t)return;
  addMessage({name:ME,text:t,mine:true,time:now()});   // عرض محلي فوري
  sendToLua('send:'+t);
  i.value='';i.focus();
}
function sendSticker(url){ addMessage({name:ME,sticker:url,mine:true,time:now()}); sendToLua('stick:'+url); }

/* ---------- picker panel ---------- */
let curPanel=null;
function togglePanel(k){
  const p=document.getElementById('panel');
  ['emoji','stick','gif','phr'].forEach(x=>document.getElementById('p-'+x).classList.toggle('on',x===k&&curPanel!==k));
  if(curPanel===k){curPanel=null;p.classList.remove('show');return;}
  curPanel=k;p.classList.add('show');
  if(k==='emoji'){p.innerHTML='<div class="egrid">'+EMOJIS.map(e=>`<span onclick="ins('${e}')">${e}</span>`).join('')+'</div>';}
  else if(k==='stick'){p.innerHTML='<div class="sgrid">'+STICKERS.map(u=>`<img src="${u}" onclick="sendSticker('${u}')">`).join('')+'</div>';}
  else if(k==='gif'){p.innerHTML='<div class="sgrid">'+GIFS.map(u=>`<img src="${u}" onclick="sendSticker('${u}')">`).join('')+'</div>';}
  else if(k==='phr'){p.innerHTML='<div class="pgrid">'+PHRASES.map(t=>`<button onclick="phr('${t}')">${t}</button>`).join('')+'</div>';}
}
function ins(e){const i=document.getElementById('msgin');i.value+=e;i.focus();}
function phr(t){addMessage({name:ME,text:t,mine:true,time:now()});sendToLua('send:'+t);togglePanel('phr');}

/* ============================================================
   Lua -> JS  (يستدعيها Lua عبر browser:sendAsync('EVENT', data))
   CSP يوصّلها لدوال window، فنخليها كلها عامة:
   ============================================================ */
window.DriveChat = {
  message: addMessage,                 // sendAsync('message', {name,text,...})
  clear:   ()=>{msgsEl.innerHTML='';},
  members: (list)=>{MEMBERS=list||[];renderMembers();},
  me:      (n)=>{ME=n||'أنت';},
  stickers:(list)=>{if(list&&list.length)STICKERS=list;},
  gifs:    (list)=>{if(list&&list.length)GIFS=list;},
  opacity: (v)=>{document.querySelector('.win').style.opacity=(v||100)/100;}
};
/* اربط أحداث sendAsync لو CSP يستخدم AC.on */
try{ if(window.AC&&AC.on){ for(const k in window.DriveChat) AC.on(k, window.DriveChat[k]); } }catch(e){}

document.getElementById('opac').oninput=function(){
  document.querySelector('.win').style.opacity=this.value/100; sendToLua('opac:'+this.value);
};

/* أعلم Lua إن الصفحة جاهزة */
window.addEventListener('load',()=>{ sendToLua('ready'); document.title='DRIVECHAT:ready'; });

/* ============================================================
   بيانات تجريبية (تنشال لما نربط Lua) — عشان تشوف الشكل حيّ
   ============================================================ */
MEMBERS=[
  {name:'MoHaMeD',rawName:'MoHaMeD',status:'on',rank:'admin'},
  {name:'KING_SA',rawName:'KING_SA',status:'on',rank:'vip'},
  {name:'RACER_X',rawName:'RACER_X',status:'on',rank:'mod'},
  {name:'DR1FT',rawName:'DR1FT',status:'busy',rank:''},
  {name:'LEGEND',rawName:'LEGEND',status:'on',rank:''},
  {name:'SPEEDY',rawName:'SPEEDY',status:'off',rank:''},
  {name:'TURBO',rawName:'TURBO',status:'busy',rank:''}
];
ME='MoHaMeD';
renderMembers();
addMessage({srv:true,text:'مرحباً بك في سيرفر DRIVE! · اضغط C لإظهار/إخفاء الشات 🧡',time:'20:45'});
addMessage({name:'KING_SA',rawName:'KING_SA',rank:'vip',text:'السلام عليكم 👋',time:'20:46'});
addMessage({name:'MoHaMeD',rawName:'MoHaMeD',rank:'admin',mine:true,text:'وعليكم السلام ورحمة الله',time:'20:46'});
addMessage({name:'RACER_X',rawName:'RACER_X',rank:'mod',text:'مساء الخير جميعاً 🔥',time:'20:47'});
addMessage({name:'DR1FT',rawName:'DR1FT',text:'مين جاهز تراكات؟ 🏁',time:'20:48'});
addMessage({name:'LEGEND',rawName:'LEGEND',mine:false,sticker:'https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcHdkam8yZXpsNjE3a2R1ZzJubWYwNnN3aXk1eDFlcWZ4dXpqbDlkbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/7kn27lnYSAE9O/giphy.gif',time:'20:49'});
</script>
</body>
</html>
